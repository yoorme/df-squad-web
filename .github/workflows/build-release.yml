name: Build & Release

# push 到 main 时在 GitHub Actions 上构建
# 产物打包上传到 GitHub Release（tag=latest），服务器只需下载解压
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js (standalone)
        run: npx next build

      - name: Assemble dist
        run: |
          # standalone 产物含精简 node_modules + server.js
          # 补充 static 和 public 到 standalone 内（运行时需要）
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public 2>/dev/null || mkdir -p .next/standalone/public

          # 打包 standalone（运行时）+ prisma（迁移用）
          mkdir -p dist
          cp -r .next/standalone dist/standalone
          cp -r prisma dist/prisma
          tar -czf dist.tar.gz -C dist .

      - name: Upload to GitHub Release (latest + 版本化归档)
        run: |
          # 覆盖式更新 latest release：服务器 update.sh 固定拉取此产物。
          #
          # 不用「先删除再重建」：
          #   1. 删除与重建之间有窗口期，此时服务器拉产物会 404；
          #   2. 更隐蔽的是——当 tag 不存在时由 API 新建的 release，
          #      GitHub 会把它标成 draft，而草稿对匿名下载不可见（同样 404）。
          #      实测由此导致过一次线上更新链路中断（latest 变草稿）。
          # 改为就地覆盖产物，并显式确保处于已发布状态。
          if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qx latest; then
            gh release upload latest dist.tar.gz --clobber
            gh release edit latest --draft=false --prerelease=false \
              --notes "Auto-built from commit ${{ github.sha }}"
          else
            gh release create latest dist.tar.gz \
              --title "Latest Build" \
              --notes "Auto-built from commit ${{ github.sha }}" \
              --target main
            # 兜底：确保不是草稿（草稿无法被服务器匿名下载）
            gh release edit latest --draft=false --prerelease=false
          fi

          # 归档 build-<sha> 标签，更新异常时可回滚；仅保留最近 5 个
          ARCHIVE_TAG="build-${GITHUB_SHA::7}"
          gh release create "$ARCHIVE_TAG" dist.tar.gz \
            --title "Build ${GITHUB_SHA::7}" \
            --notes "Archived build from commit ${{ github.sha }}" \
            --target main

          # release list 默认按发布时间倒序，第 6 个起即为待清理的旧归档
          gh release list --json tagName --jq '.[].tagName' \
            | grep '^build-' | tail -n +6 | while read -r tag; do
                [ -n "$tag" ] && gh release delete "$tag" --yes --cleanup-tag || true
              done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
